# Security Digest — example runtime configuration
#
# Copy this file to config/settings.yaml and fill in real values.
# config/settings.yaml is git-ignored and must never be committed.
#
# Runtime configuration is YAML-only. No environment variables override values here.
# The only accepted env var is APP_CONFIG_PATH, which selects which file to load.
#
# Default config path: config/settings.yaml
# Override path:       APP_CONFIG_PATH=/path/to/settings.yaml

app:
  # Base URL used to build absolute links (e.g. in Telegram messages).
  public_base_url: "http://localhost:8000"

database:
  url: "postgresql://digest:digest@localhost:5432/digest"

llm:
  provider: "anthropic"
  api_key: ""                               # set your Anthropic API key here
  model_extraction: "claude-haiku-4-5-20251001"
  model_scoring: "claude-haiku-4-5-20251001"

telegram:
  enabled: false
  bot_token: ""                             # Telegram bot token
  chat_id: ""                               # target chat or channel ID

scheduler:
  enabled: false                            # set true to enable daily background runs
  daily_time_utc: "06:00"                   # HH:MM UTC when daily pipeline fires
  publish_telegram_by_default: false        # publish to Telegram in scheduled runs

digest:
  output_language: "en"                     # rendered digest language: "en" or "ru"
                                            # Controls the internal mass-stage LLM pipeline:
                                            # extraction and scoring generate only the
                                            # configured language's summary/why-it-matters
                                            # fields. The unused language is not requested,
                                            # saving tokens on every story and cluster.
  model_writing: "claude-haiku-4-5-20251001" # model for final digest-writing stage
